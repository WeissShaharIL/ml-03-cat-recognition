server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://cat-backend:8000/;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_set_header Host $host;
    }
}